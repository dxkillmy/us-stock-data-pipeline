services:
  postgres:
    image: postgres:15
    container_name: stock_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
      POSTGRES_DB: ${DB_NAME:-stock_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-stock_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline:
    build: .
    container_name: stock_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-stock_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-1234}
      - PERIOD=${PERIOD:-5d}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: stock_airflow
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-stock_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-1234}
      - PERIOD=5d
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}

volumes:
  postgres_data: